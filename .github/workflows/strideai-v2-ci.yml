name: StrideAI v2 CI

on:
  push:
    paths:
      - "07-v2-implementation/**"
      - ".github/workflows/strideai-v2-ci.yml"
  pull_request:
    paths:
      - "07-v2-implementation/**"
      - ".github/workflows/strideai-v2-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-v2-implementation

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: 07-v2-implementation/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m app.evaluation evaluation/cases.json
